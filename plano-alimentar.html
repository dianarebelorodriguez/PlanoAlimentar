<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plano Alimentar – Registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ed; --surface:#fff; --surface-2:#f1ede4; --text:#1b1a17; --muted:#6e685d;
  --line:#e4ded2; --accent:#2f6f4e; --accent-ink:#fff; --accent-soft:#e3efe7;
  --carb:#c8763c; --fat:#7a6aa8; --prot:#2f6f4e;
  --danger:#b03b3b; --ok:#2f6f4e; --warn:#b07d2b;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(27,26,23,.05), 0 8px 24px rgba(27,26,23,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131411; --surface:#1c1e1a; --surface-2:#232520; --text:#eceade; --muted:#a09a8c;
  --line:#2f3229; --accent:#5fa87d; --accent-ink:#0f130f; --accent-soft:#22302a;
  --carb:#dc9560; --fat:#9d8fc9; --prot:#5fa87d; --danger:#d97070; --ok:#5fa87d; --warn:#d0a052;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#131411; --surface:#1c1e1a; --surface-2:#232520; --text:#eceade; --muted:#a09a8c;
  --line:#2f3229; --accent:#5fa87d; --accent-ink:#0f130f; --accent-soft:#22302a;
  --carb:#dc9560; --fat:#9d8fc9; --prot:#5fa87d; --danger:#d97070; --ok:#5fa87d; --warn:#d0a052;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:840px;margin:0 auto;padding:0 16px 120px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-inner{max-width:840px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:Fraunces,serif;font-size:17px;flex:1;line-height:1.15}
.brand small{display:block;font-family:Inter,sans-serif;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font-size:14px;flex:none}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-inner{max-width:840px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:0}
.tab{background:none;border:0;padding:12px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:13px;font-weight:600}
.tab .ic{font-size:17px;line-height:1}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::after{content:"";position:absolute}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:baseline;gap:8px;margin:20px 2px 9px}
.sec-title h2{font-size:16px;margin:0;flex:1}
.sec-title .hint{font-size:11.5px;color:var(--muted)}

.day-nav{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.day-nav .d-label{flex:1;text-align:center;font-weight:600;font-size:14px}
.day-nav .d-label small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.plan-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.plan-chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.25}
.plan-chip b{display:block;font-size:12.5px}
.plan-chip span{font-weight:500;font-size:10.5px;opacity:.85}
.plan-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.kcal-box{padding:16px 18px 14px;text-align:center}
.kcal-big{font-family:Fraunces,serif;font-size:36px;line-height:1}
.kcal-big span{font-size:14px;color:var(--muted);font-family:Inter,sans-serif;font-weight:500}
.kcal-sub{font-size:12px;color:var(--muted);margin-top:3px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar.over>i{background:var(--warn)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 16px}
.macro{background:var(--surface-2);border-radius:var(--radius-sm);padding:9px 10px}
.macro .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.macro .val{font-size:14px;font-weight:600;margin-top:1px}
.macro .val small{font-weight:500;color:var(--muted);font-size:11px}
.macro .bar{height:5px;margin-top:6px}
.macro.p .bar>i{background:var(--prot)}.macro.c .bar>i{background:var(--carb)}.macro.g .bar>i{background:var(--fat)}

.rmeal{padding:0}
.rmeal+.rmeal{border-top:1px solid var(--line)}
.rmeal-head{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.rmeal-head b{flex:1;font-family:Fraunces,serif;font-size:15px;font-weight:600}
.rmeal-head .k{font-size:12px;color:var(--muted);white-space:nowrap}
.rows{list-style:none;margin:0;padding:0 16px}
.rows li{display:flex;gap:9px;align-items:baseline;padding:6px 0;border-top:1px dashed var(--line);font-size:13.5px}
.rows li .nm{flex:1;min-width:0}
.rows li .nm small{display:block;color:var(--muted);font-size:11px}
.rows li .kc{font-size:12.5px;font-weight:600;white-space:nowrap}
.acts{display:flex;gap:7px;padding:9px 16px 13px;flex-wrap:wrap}
.mini{background:var(--surface-2);border:0;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--text)}
.mini.pri{background:var(--accent);color:var(--accent-ink)}
.x{background:none;border:0;color:var(--muted);font-size:15px;padding:0 2px;line-height:1}
.x:hover{color:var(--danger)}
.empty{padding:22px 18px;text-align:center;color:var(--muted);font-size:13px}

.meal{padding:13px 16px}
.meal+.meal{border-top:1px solid var(--line)}
.meal-head{display:flex;align-items:baseline;gap:9px}
.meal-name{font-family:Fraunces,serif;font-size:15.5px;flex:1}
.meal-kcal{font-size:11.5px;color:var(--muted);white-space:nowrap}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pill{background:var(--surface-2);border:1px solid transparent;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.items{list-style:none;margin:10px 0 0;padding:0}
.items>li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.items>li:last-child{border-bottom:0}
.items .nm{display:flex;gap:8px}
.items .nm .a{flex:1}
.items .qtd{color:var(--muted);font-size:11.5px;text-align:right;max-width:48%}
.subs summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:11.5px;list-style:none;margin-top:3px}
.subs summary::-webkit-details-marker{display:none}
.subs summary::before{content:"⇄ "}
.subs ul{margin:5px 0 2px;padding-left:16px;font-size:12px;color:var(--muted)}
.obs{white-space:pre-line;margin-top:9px;font-size:12px;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-radius:var(--radius-sm)}
.mtot{margin-top:8px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.mtot b{color:var(--text);font-weight:600}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}

.water{display:flex;align-items:center;gap:10px;padding:13px 16px}
.water .wv{font-family:Fraunces,serif;font-size:18px;min-width:108px}
.water .wv small{font-family:Inter,sans-serif;font-size:11px;color:var(--muted);font-weight:500}
.water .grow{flex:1}

.chart{padding:14px 16px 12px}
.chart .bars{position:relative;display:flex;align-items:stretch;gap:7px;height:96px}
.chart .stack{flex:1;background:var(--surface-2);border-radius:5px 5px 0 0;position:relative;overflow:hidden}
.chart .stack>i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.chart .stack.over>i{background:var(--warn)}
.chart .pctl{position:absolute;left:0;right:0;text-align:center;font-size:9.5px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.1}
.chart .labels{display:flex;gap:7px;margin-top:4px}
.chart .labels span{flex:1;text-align:center;font-size:9.5px;color:var(--muted)}
.avgline{position:absolute;left:-4px;right:-4px;border-top:1.5px dashed var(--text);opacity:.7;pointer-events:none}
.chart-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 10px}
.chart-top .bal small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chart-top .bal b{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;line-height:1.1}
.avgleg{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;font-weight:600;color:var(--text);margin:0 0 3px}
.avgleg i{display:inline-block;width:18px;border-top:1.5px dashed var(--text);opacity:.7}
.chart .pctl{text-shadow:0 0 3px var(--surface),0 0 3px var(--surface)}
.hist-row{display:flex;gap:10px;padding:9px 16px;font-size:13px;align-items:center}
.hist-row+.hist-row{border-top:1px solid var(--line)}
.hist-row .hd{flex:1;min-width:0}
.hist-row .hd small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.field{padding:12px 16px}
.field+.field{border-top:1px solid var(--line)}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:14px}
textarea.inp{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:11px;resize:vertical}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:9px 15px;font-size:13px;font-weight:600}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.block{display:block;width:100%;text-align:center;padding:12px;border-radius:var(--radius-sm)}

.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(20,18,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:88vh;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 16px);display:flex;flex-direction:column;border-radius:20px 20px 0 0;border:1px solid var(--line)}
@media(min-width:640px){.sheet-bg{align-items:center;padding:20px}.sheet{border-radius:20px;max-height:86vh}}
.sheet-bg.top{align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
.sheet.full{height:calc(100vh - env(safe-area-inset-top,0px) - 8px);height:calc(100dvh - env(safe-area-inset-top,0px) - 8px);max-height:none;border-radius:20px 20px 0 0}
@media(min-width:640px){.sheet-bg.top{padding:20px}.sheet.full{height:86vh;border-radius:20px}}
.busca-top{padding:12px 16px 6px;flex:none;border-bottom:1px solid var(--line)}
.busca-top form{margin:0}
input[type=search]::-webkit-search-decoration,input[type=search]::-webkit-search-results-button{-webkit-appearance:none}
input[type=search]{-webkit-appearance:none;appearance:none}
@media (max-width:640px){ .inp, select.inp, input.inp{font-size:16px} }
.sheet-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.sheet-head h3{margin:0;font-size:16px;flex:1}
.sheet-body{padding:13px 16px;overflow:auto;flex:1}
.sheet-foot{border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex:none}
.sheet-foot .tot{flex:1;font-size:11.5px;color:var(--muted);line-height:1.35}
.sheet-foot .tot b{color:var(--text);font-size:14px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch}
.cats .pill{white-space:nowrap}
.flist{list-style:none;margin:6px 0 0;padding:0}
.flist li{padding:9px 2px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline;cursor:pointer}
.flist li:hover{background:var(--surface-2)}
.flist .fn{flex:1;font-size:13.5px}
.flist .fn small{display:block;color:var(--muted);font-size:11px}
.flist .fk{font-size:11.5px;color:var(--muted);white-space:nowrap}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:var(--radius-sm);font-size:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.banner b{color:var(--text)}
.hide{display:none!important}
</style>
</head>
<body>

<header class="top"><div class="top-inner">
  <div class="brand">Plano Alimentar<small id="subTitle">planos &amp; registro</small></div>
  <button class="icon-btn" data-act="openBanco" title="Banco de alimentos" aria-label="Banco de alimentos"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button>
  <button class="icon-btn" data-act="openAjustes" title="Ajustes">⚙</button>
  <button class="icon-btn" id="themeBtn" title="Tema">◐</button>
</div></header>

<main class="wrap">
  <section id="view"></section>
</main>

<nav class="tabs"><div class="tabs-inner">
  <button class="tab" data-tab="registro" aria-selected="true"><span class="ic">✓</span>Registro</button>
  <button class="tab" data-tab="planos" aria-selected="false"><span class="ic">☰</span>Planos</button>
</div></nav>

<div id="sheetHost"></div>

<script>
/* ==========================================================================
   A. BANCO DE ALIMENTOS – valores por 100 g
   fonte: 'TACO' (tabela brasileira, valores de referência), 'rótulo' (produto
   de marca, aproximado), 'plano' (derivado dos macros impressos no PDF),
   'estimativa' (preparação composta / variável).
   Todos os valores são de referência e podem ser editados no app.
   ========================================================================== */
function F(id,nome,cat,kcal,p,c,g,fonte,med){
  return {id:id,nome:nome,cat:cat,kcal:kcal,p:p,c:c,g:g,fonte:fonte,med:med||[]};
}
/* alimento com valores por PORÇÃO (restaurantes, comida de rua) */
function P(id,nome,cat,por,kcal,p,c,g,fonte){
  return {id:id,nome:nome,cat:cat,kcal:kcal,p:p,c:c,g:g,fonte:fonte,med:[],por:por};
}
var CS='colher de sopa', CC='colher de chá', CSV='colher de servir', UN='unidade', FT='fatia', XIC='xícara';

var ALIM_BASE = [
/* --- Cereais, pães e massas --- */
F('arroz-branco','Arroz branco cozido','Cereais e massas',128,2.5,28.1,0.2,'TACO',[[CS,25],[CSV,55]]),

F('macarrao','Macarrão cozido','Cereais e massas',140,5.0,28.0,1.1,'estimativa',[[CS,30],[XIC,140]]),
F('macarrao-arroz','Macarrão de arroz cozido','Cereais e massas',109,2.0,24.9,0.2,'estimativa',[[CS,30]]),
F('macarrao-integral','Macarrão integral cozido','Cereais e massas',124,5.3,26.5,0.9,'estimativa',[[CS,30]]),
F('quinoa','Quinoa cozida','Cereais e massas',120,4.4,21.3,1.9,'estimativa',[[CS,25]]),
F('cuscuz-milho','Cuscuz de milho cozido','Cereais e massas',113,2.4,25.3,0.6,'TACO',[[FT,80]]),
F('pao-frances','Pão francês','Cereais e massas',300,8.0,58.6,3.1,'TACO',[[UN,50]]),
F('pao-forma','Pão de forma branco','Cereais e massas',275,8.0,52.0,3.5,'estimativa',[[FT,25]]),
F('pao-forma-integral','Pão de forma integral','Cereais e massas',253,9.4,49.9,3.5,'TACO',[[FT,25]]),
F('goma-tapioca','Goma de tapioca (hidratada)','Cereais e massas',290,0.3,71.5,0.1,'estimativa',[[CS,15]]),
F('aveia','Aveia em flocos','Cereais e massas',394,13.9,66.6,8.5,'TACO',[[CS,15]]),
F('granola','Granola sem açúcar','Cereais e massas',450,10.0,60.0,17.0,'estimativa',[[CS,15]]),
F('bolacha-arroz','Bolacha de arroz','Cereais e massas',385,8.0,81.0,3.0,'rótulo',[[UN,7.5]]),
F('pipoca','Pipoca sem óleo (estourada)','Cereais e massas',387,12.0,78.0,4.3,'estimativa',[[XIC,10]]),
F('farofa','Farofa pronta','Cereais e massas',405,3.5,60.0,17.0,'estimativa',[[CS,15]]),
F('pao-queijo','Pão de queijo','Cereais e massas',363,5.1,34.2,24.6,'TACO',[['coquetel (20 g)',20],['grande (60 g)',60],['unidade média (40 g)',40]]),

/* --- Tubérculos --- */
F('batata','Batata inglesa cozida','Tubérculos',52,1.2,11.9,0.1,'TACO',[[UN,100]]),
F('batata-doce','Batata-doce cozida','Tubérculos',77,0.6,18.4,0.1,'TACO',[[FT,40]]),
F('mandioca','Mandioca cozida','Tubérculos',125,0.6,30.1,0.3,'TACO',[]),
F('pure-batata','Purê de batata','Tubérculos',93,1.8,14.0,3.4,'estimativa',[[CS,25]]),
F('batata-frita','Batata frita caseira','Tubérculos',267,5.0,35.6,13.1,'TACO',[[XIC,80]]),

/* --- Leguminosas --- */
F('feijao-preto','Feijão preto cozido','Leguminosas',77,4.5,14.0,0.5,'TACO',[['concha',80]]),
F('feijao-carioca','Feijão carioca cozido','Leguminosas',76,4.8,13.6,0.5,'TACO',[['concha',80]]),
F('lentilha','Lentilha cozida','Leguminosas',93,6.3,16.3,0.5,'TACO',[['concha',80]]),
F('grao-de-bico','Grão-de-bico cozido','Leguminosas',164,8.9,27.4,2.6,'estimativa',[[CS,30]]),
F('feijao-fradinho','Feijão-fradinho cozido','Leguminosas',78,5.1,13.5,0.5,'TACO',[['concha',80]]),
F('homus','Homus','Leguminosas',250,7.5,20,17.5,'plano',[['2 col. sopa (40 g)',40]]),
F('edamame','Edamame cozido','Leguminosas',125,11.0,9.0,5.2,'estimativa',[]),

/* --- Carnes, aves, peixes e ovos --- */

var S={ tab:'registro', base:null, dateKey:todayKey(), day:null, hist:[], backend:'local', db:null,
        unsubDay:null, unsubBase:null, planoView:'1.1', selOpt:{}, pick:null, busca:{q:'',cat:'Todos',meal:null} };

function todayKey(d){ d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function keyToDate(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function shiftKey(k,n){ var d=keyToDate(k); d.setDate(d.getDate()+n); return todayKey(d); }
function fmtDayLong(k){ var t=todayKey();
  if(k===t)return'Hoje'; if(k===shiftKey(t,-1))return'Ontem'; if(k===shiftKey(t,1))return'Amanhã';
  return keyToDate(k).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }
function fmtWeekday(k){ return keyToDate(k).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}); }
function n(v){ v=Number(v); return isFinite(v)?v:0; }
function r0(v){ return Math.round(n(v)); }
function r1(v){ return Math.round(n(v)*10)/10; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowTime(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

function alimentos(){
  var extra=(S.base&&S.base.alimentosCustom)||[];
  var map={}; ALIM_BASE.forEach(function(a){ map[a.id]=a; });
  extra.forEach(function(a){ map[a.id]=a; });
  ((S.base&&S.base.alimentosOcultos)||[]).forEach(function(id){ delete map[id]; });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function alim(id){ var a=alimentos().filter(function(x){return x.id===id;}); return a[0]||null; }
function macrosDe(id,qtd){
  var a=alim(id); if(!a) return {kcal:0,p:0,c:0,g:0};
  var f = a.por ? n(qtd) : n(qtd)/100;
  return {kcal:a.kcal*f, p:a.p*f, c:a.c*f, g:a.g*f};
}
function somaMacros(list){ var t={kcal:0,p:0,c:0,g:0};
  list.forEach(function(m){ t.kcal+=n(m.kcal); t.p+=n(m.p); t.c+=n(m.c); t.g+=n(m.g); }); return t; }
function calcOpcao(op){ return somaMacros((op.itens||[]).map(function(i){ return macrosDe(i.f,i.g); })); }

function planos(){ return (S.base&&S.base.planos)||[]; }
function planoById(id){ var a=planos().filter(function(p){return p.id===id;});
  if(a[0]) return a[0]; if(PLANOS_ANTIGOS[id]) return PLANOS_ANTIGOS[id]; return planos()[0]; }
function planoAtualId(id){ if(planos().some(function(p){return p.id===id;})) return id;
  if(id && /^1\./.test(id)) return '2.'+id.slice(2); return '2.1'; }
function dayPlanoId(){ if(S.day&&S.day.planoId) return S.day.planoId;
  var l=null; try{ l=localStorage.getItem('nutri.lastPlano'); }catch(e){} return planoAtualId(l); }
function planoDoDia(){ return planoById(dayPlanoId()); }
function somaPadrao(plano,modo){
  var t={kcal:0,p:0,c:0,g:0};
  (plano.refeicoes||[]).forEach(function(m){ if(m.alternativa) return;
    var o=(m.opcoes||[])[0]; if(!o) return;
    var v = (modo==='banco'||!o.prescrito) ? calcOpcao(o) : o.prescrito;
    t.kcal+=n(v.kcal); t.p+=n(v.p); t.c+=n(v.c); t.g+=n(v.g); });
  return t;
}
function metas(){
  var p=planoDoDia(), cfg=(S.base&&S.base.config)||{};
  var base = cfg.baseMeta==='banco' ? somaPadrao(p,'banco') : p.referencia;
  return { kcal:n(base.kcal), p:n(base.p), c:n(base.c), g:n(base.g), agua:n(cfg.agua)||2500 };
}
function dayTotals(day){ return somaMacros(((day&&day.registros)||[])); }
function emptyDay(k){ return {data:k,planoId:dayPlanoId(),registros:[],agua:0,peso:null}; }

/* ==========================================================================

var LS_BASE='nutri3.base', LS_DAY='nutri3.day.';
function lsGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var Store={
  async init(){
    try{ if(window.claude&&typeof window.claude.use==='function') S.db=await window.claude.use('db'); }catch(e){ S.db=null; }
    S.backend=S.db?'db':'local';
  },
  watchBase(cb){
    if(S.db){ try{ return S.db.doc('plano/base3').onSnapshot(function(s){ cb(s.exists?s.data():null); },function(){ cb(lsGet(LS_BASE)); }); }
      catch(e){ cb(lsGet(LS_BASE)); return function(){}; } }
    cb(lsGet(LS_BASE)); return function(){};
  },
  async saveBase(b){ lsSet(LS_BASE,b);
    if(S.db){ try{ await S.db.doc('plano/base3').set(b); }catch(e){ toast('Falha ao salvar na nuvem.'); } }
    else { S.base=b; render(); } },
  watchDay(key,cb){
    if(S.db){ try{ return S.db.doc('dias3/'+key).onSnapshot(function(s){ cb(s.exists?s.data():null); },function(){ cb(lsGet(LS_DAY+key)); }); }
      catch(e){ cb(lsGet(LS_DAY+key)); return function(){}; } }
    cb(lsGet(LS_DAY+key)); return function(){};
  },
  async saveDay(d){ lsSet(LS_DAY+d.data,d);
    try{ localStorage.setItem('nutri.lastPlano',d.planoId||'1.1'); }catch(e){}
    if(S.db){ try{ await S.db.doc('dias3/'+d.data).set(d); }catch(e){ toast('Falha ao salvar na nuvem.'); } }
    else { S.day=d; render(); } },
  async allDays(limit){
    if(S.db){ try{ var s=await S.db.collection('dias3').orderBy('data','desc').limit(limit||30).get();
      return s.docs.map(function(d){ return d.data(); }); }catch(e){} }
    var out=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
      if(k&&k.indexOf(LS_DAY)===0){ var v=lsGet(k); if(v) out.push(v); } } }catch(e){}
    out.sort(function(a,b){ return a.data<b.data?1:-1; });
    return out.slice(0,limit||30);
  }
};

function subscribeDay(){
  if(S.unsubDay){ try{ S.unsubDay(); }catch(e){} }
  var key=S.dateKey; S.day=null;
  S.unsubDay=Store.watchDay(key,function(d){ if(key!==S.dateKey) return;
    S.day=(d&&d.data)?d:emptyDay(key); render(); });
}
function setDate(k){ S.dateKey=k; subscribeDay(); render(); }
function curDay(){ return S.day?JSON.parse(JSON.stringify(S.day)):emptyDay(S.dateKey); }
async function commit(d){ d.data=S.dateKey; S.day=d; render(); await Store.saveDay(d); }
async function setPlano(id){ var d=curDay(); d.planoId=id; await commit(d); }
async function addRows(rows){ var d=curDay(); d.registros=(d.registros||[]).concat(rows); await commit(d); }
async function removeRow(id){ var d=curDay(); d.registros=(d.registros||[]).filter(function(x){return x.id!==id;}); await commit(d); }
async function clearMeal(mid){ var d=curDay(); d.registros=(d.registros||[]).filter(function(x){return x.refeicaoId!==mid;}); await commit(d); }
async function addWater(ml){ var d=curDay(); d.agua=Math.max(0,n(d.agua)+ml); await commit(d); }
async function setPeso(v){ var d=curDay(); d.peso=v===''?null:n(v); S.day=d; await Store.saveDay(d); }

function novoRegistro(alimentoId,gramas,medidaTxt,refeicaoId,refeicaoNome,hora){
  var a=alim(alimentoId), m=macrosDe(alimentoId,gramas);
  return { id:uid(), refeicaoId:refeicaoId, refeicaoNome:refeicaoNome,
    alimentoId:alimentoId, nome:a?a.nome:'Item', qtd:n(gramas), un:(a&&a.por)?'porção':'g', medida:medidaTxt||((a&&a.por)?a.por:''),
    kcal:r1(m.kcal), p:r1(m.p), c:r1(m.c), g:r1(m.g), hora:hora||nowTime(), fonte:a?a.fonte:'' };
}

function barHTML(val,target){
  var pct=target>0?Math.min(100,(val/target)*100):0, over=target>0&&val>target*1.05;
  return '<div class="bar '+(over?'over':'')+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>';
}
function difTxt(val,target){
  if(!target) return '';
  var d=Math.round(n(val)-n(target));
  return '<br><span style="white-space:nowrap;color:'+(d>0?'var(--warn)':'var(--muted)')+'">('+(d>0?'+ ':'- ')+Math.abs(d)+' g)</span>';
}
function macroBox(cls,label,val,target){

   +'<div class="val">'+r0(val)+'<small> / '+r0(target)+' g'+difTxt(val,target)+'</small></div>'+barHTML(val,target)+'</div>';

function histHTML(){
  var keys=[]; for(var i=6;i>=0;i--) keys.push(shiftKey(todayKey(),-i));
  var byKey={}; S.hist.forEach(function(d){ byKey[d.data]=d; });
  if(S.day&&S.day.data) byKey[S.day.data]=S.day;
  var rows=keys.map(function(k){ var d=byKey[k]||{data:k,registros:[]};
    var p=planoById(d.planoId||'2.1');
    return {k:k,d:d,t:dayTotals(d),meta:n(p.referencia.kcal),plano:p}; });
  var com=rows.filter(function(r){ return (r.d.registros||[]).length>0; });
  var media = com.length ? com.reduce(function(a,r){ return a+r.t.kcal; },0)/com.length : 0;
  var bal = com.length ? com.reduce(function(a,r){ return a+(r.t.kcal-r.meta); },0)/com.length : 0;
  var balR = Math.round(bal);
  var max=1; rows.forEach(function(r){ max=Math.max(max,r.t.kcal,r.meta); }); max=Math.max(max,media);
  var h='<div class="sec-title"><h2>Últimos 7 dias</h2><span class="hint">kcal por dia</span></div><div class="card"><div class="chart">'+(com.length?'<div class="chart-top"><div class="bal"><small>balanço médio diário</small><b style="color:'+(balR>0?'var(--warn)':'var(--accent)')+'">'+(balR>0?'+':balR<0?'−':'')+Math.abs(balR).toLocaleString('pt-BR')+' kcal</b></div><div class="avgleg"><i></i>média '+r0(media).toLocaleString('pt-BR')+' kcal</div></div>':'')+'<div class="bars">';
  rows.forEach(function(r){
    var pct=(r.t.kcal/max)*100, over=r.meta&&r.t.kcal>r.meta*1.05;
    var temReg=(r.d.registros||[]).length>0, dif=r.meta?Math.round((r.t.kcal/r.meta-1)*100):0;
    var lbl=temReg&&r.meta?'<b class="pctl" style="bottom:'+Math.min(pct,82).toFixed(1)+'%">'+(dif>0?'+':'')+dif+'%</b>':'';
    h+='<div class="stack '+(over?'over':'')+'"><i style="height:'+pct.toFixed(1)+'%"></i>'+lbl+'</div>'; });
  if(media>0) h+='<div class="avgline" style="bottom:'+((media/max)*100).toFixed(1)+'%"></div>';
  h+='</div><div class="labels">';
  rows.forEach(function(r){ h+='<span>'+keyToDate(r.k).toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3)+'</span>'; });
  h+='</div></div>';
  rows.slice().reverse().forEach(function(r){
    h+='<div class="hist-row"><div class="hd"><b>'+esc(fmtDayLong(r.k))+'</b><small>'+esc(r.plano.curto)+' · '
     +'P '+r1(r.t.p)+' · C '+r1(r.t.c)+' · G '+r1(r.t.g)
     +'</small></div>'
     +'<div style="font-weight:600;font-size:13px;white-space:nowrap">'+r0(r.t.kcal)
     +'<span style="color:var(--muted);font-weight:500">/'+r0(r.meta)+'</span></div></div>'; });
  h+='</div>';
  return h;
}

     +'<div style="flex:1;min-width:0"><div style="font-size:13.5px" class="opNm" data-i="'+idx+'">'+esc(a?a.nome:i2.f)+'</div>'
     +'<div style="font-size:11px;color:var(--muted)" class="opQ" data-i="'+idx+'">'+esc(i2.q)+'</div></div>'
     +'<input class="inp opG" data-i="'+idx+'" type="number" step="'+(por?'0.5':'1')+'" value="'+i2.g+'" style="width:74px;text-align:right;padding:6px 8px">'
     +'<span class="opU" data-i="'+idx+'" style="font-size:11px;color:var(--muted);width:40px">'+(por?'porção':'g')+'</span></div>';

function opSelecao(){
  var host=document.getElementById('sheetHost');
  var btn=host.querySelector('[data-act="addOpcao"]'); if(!btn) return [];
  var plano=planoById(btn.dataset.plano);
  var ref=(plano.refeicoes||[]).filter(function(x){return x.id===btn.dataset.meal;})[0];
  var o=(ref.opcoes||[])[+btn.dataset.i]||{itens:[]};
  var out=[];
  Array.prototype.forEach.call(host.querySelectorAll('.opChk'),function(cb){
    if(!cb.checked) return;

    var gi=host.querySelector('.opG[data-i="'+i+'"]'), g=gi?n(gi.value):item.g;

/* ==========================================================================
   H. Eventos
   ========================================================================== */
document.addEventListener('click',function(ev){
  var tab=ev.target.closest('.tab');
  if(tab){ S.tab=tab.dataset.tab; if(S.tab==='planos') S.planoView=planoAtualId(dayPlanoId());
    else Store.allDays(30).then(function(d){ S.hist=d; render(); });
    render(); window.scrollTo(0,0); return; }

  var el=ev.target.closest('[data-act]'); if(!el) return;
  var act=el.dataset.act;

  if(act==='closeBg'){ if(ev.target===el) closeSheet(); return; }
  if(act==='close'){ closeSheet(); return; }
  if(act==='prevDay'){ setDate(shiftKey(S.dateKey,-1)); return; }
  if(act==='nextDay'){ setDate(shiftKey(S.dateKey,1)); return; }
  if(act==='setPlano'){ setPlano(el.dataset.id); return; }
  if(act==='viewPlano'){ S.planoView=el.dataset.id; render(); return; }
  if(act==='selOpt'){ S.selOpt[el.dataset.key]=+el.dataset.i; render(); return; }
  if(act==='water'){ addWater(+el.dataset.ml); return; }
  if(act==='delRow'){ removeRow(el.dataset.id); return; }
  if(act==='limparRef'){ clearMeal(el.dataset.meal); return; }
  if(act==='buscar'){ openBusca(el.dataset.meal); return; }
  if(act==='cat'){ S.busca.cat=el.dataset.c; renderBusca(); return; }
  if(act==='pick'){ openQtd(el.dataset.id); return; }
  if(act==='novoAlimento'){ openNovoAlimento(); return; }
  if(act==='opcaoPlano'){ openOpcaoPlano(el.dataset.meal); return; }
  if(act==='opPlanoSel'){ openOpcaoPlano(el.dataset.meal,null,+el.dataset.i); return; }
  if(act==='openAjustes'){ openAjustes(); return; }
  if(act==='openBanco'){ openBusca(null,true); return; }
  if(act==='export'){ openExport(); return; }
  if(act==='importUI'){ openImport(); return; }

  if(act==='regOpcao'){
    if(el.dataset.plano!==dayPlanoId()){
      setPlano(el.dataset.plano).then(function(){ S.tab='registro'; render(); openOpcaoPlano(el.dataset.meal,el.dataset.plano,+el.dataset.i); });
    } else { S.tab='registro'; render(); openOpcaoPlano(el.dataset.meal,el.dataset.plano,+el.dataset.i); }
    return;
  }
  if(act==='addQtd'){
    var g=qtdGramas();
    if(g<=0){ toast('Informe a quantidade.'); return; }
    var mid=document.getElementById('qMeal').value;
    var medSel=document.getElementById('qMed'), medLbl=medSel.options[medSel.selectedIndex].dataset.lbl;
    var qv=document.getElementById('qVal').value;
    var aa=alim(el.dataset.id);
    var medTxt = (aa&&aa.por) ? aa.por : (n(medSel.value)===1?'':(qv+' '+medLbl));
    addRows([ novoRegistro(el.dataset.id,g, medTxt, mid, mealNome(mid), nowTime()) ]);
    closeSheet(); return;
  }
  if(act==='addOpcao'){
    var sel=opSelecao();
    if(!sel.length){ toast('Selecione ao menos um alimento.'); return; }
    var mid2=el.dataset.meal, hora=nowTime();
    addRows(sel.map(function(x){ return novoRegistro(x.f,x.g,'',mid2,mealNome(mid2),hora); }));
    closeSheet(); return;
  }
  if(act==='editAlim'){ openEditarAlimento(el.dataset.id); return; }
  if(act==='salvarEdicao'){
    var orig=alim(el.dataset.id); if(!orig) return;
    var nm=(document.getElementById('eaNome').value||'').trim(); if(!nm){ toast('Dê um nome ao alimento.'); return; }
    var ed=JSON.parse(JSON.stringify(orig));
    ed.nome=nm; ed.kcal=n(document.getElementById('eaKcal').value); ed.p=n(document.getElementById('eaP').value);
    ed.c=n(document.getElementById('eaC').value); ed.g=n(document.getElementById('eaG').value);
    ed.cat=(document.getElementById('eaCat').value||orig.cat).trim();
    var ep=document.getElementById('eaPor'); if(ep) ed.por=ep.value||orig.por;
    ed.fonte='meu';
    var bE=JSON.parse(JSON.stringify(S.base)); bE.alimentosCustom=(bE.alimentosCustom||[]).filter(function(x){ return x.id!==ed.id; });
    bE.alimentosCustom.push(ed);
    Store.saveBase(bE).then(function(){ toast('Alimento atualizado.'); openQtd(ed.id); });
    return;
  }
  if(act==='delAlim'){
    var idD=el.dataset.id;
    if(alimNoPlano(idD)){ toast('Esse alimento faz parte do plano: dá para editar, mas não excluir.'); return; }
    if(el.dataset.ok!=='1'){ el.dataset.ok='1'; el.textContent='Toque de novo para excluir'; el.style.color='var(--danger)'; return; }
    var bD=JSON.parse(JSON.stringify(S.base));
    bD.alimentosCustom=(bD.alimentosCustom||[]).filter(function(x){ return x.id!==idD; });
    if(ALIM_BASE.some(function(x){ return x.id===idD; })){ bD.alimentosOcultos=(bD.alimentosOcultos||[]); if(bD.alimentosOcultos.indexOf(idD)<0) bD.alimentosOcultos.push(idD); }
    Store.saveBase(bD).then(function(){ toast('Alimento excluído do banco.'); openBusca(S.busca.meal,S.busca.ger); });
    return;
  }
  if(act==='salvarAlimento'){
    var nome=(document.getElementById('naNome').value||'').trim();
    if(!nome){ toast('Dê um nome ao alimento.'); return; }
    var b=S.base?JSON.parse(JSON.stringify(S.base)):basePadrao();
    b.alimentosCustom=b.alimentosCustom||[];
    b.alimentosCustom.push({ id:'cust-'+uid(), nome:nome, cat:(document.getElementById('naCat').value||'Meus alimentos'),
      kcal:n(document.getElementById('naKcal').value), p:n(document.getElementById('naP').value),
      c:n(document.getElementById('naC').value), g:n(document.getElementById('naG').value), fonte:'meu', med:[] });
    Store.saveBase(b).then(function(){ toast('Alimento salvo.'); openBusca(S.busca.meal,S.busca.ger); });
    return;
  }
  if(act==='saveCfg'){
    var b2=S.base?JSON.parse(JSON.stringify(S.base)):basePadrao();
    b2.config=b2.config||{};
    b2.config.baseMeta=document.getElementById('cfgBase').value;
    Store.saveBase(b2).then(function(){ toast('Salvo.'); closeSheet(); });
    return;
  }
  if(act==='doImport'){
    var obj; try{ obj=JSON.parse(document.getElementById('impTxt').value); }catch(e){ toast('JSON inválido.'); return; }
    if(obj.base&&obj.dias){
      Store.saveBase(obj.base);
      Promise.all(obj.dias.map(function(d){ return Store.saveDay(d); })).then(function(){
        toast('Backup restaurado.'); subscribeDay(); closeSheet(); });
    } else toast('Formato não reconhecido.');
    return;
  }
  if(act==='restore'){ Store.saveBase(basePadrao()).then(function(){ toast('Restaurado.'); closeSheet(); }); return; }
  if(act==='wipeDay'){ var d3=emptyDay(S.dateKey); d3.planoId=dayPlanoId(); commit(d3).then(function(){ toast('Dia limpo.'); closeSheet(); }); return; }
});

});

async function aplicarSeed(){
  if(!SEED_BACKUP || !SEED_BACKUP.dias) return;
  var existentes = await Store.allDays(1000), tem={};
  existentes.forEach(function(d){ tem[d.data]=1; });
  for(var i=0;i<SEED_BACKUP.dias.length;i++){
    var d=SEED_BACKUP.dias[i];
    if(d && d.data && !tem[d.data]) await Store.saveDay(d);
  }
}

(async function(){
  await Store.init();
  try{ await aplicarSeed(); }catch(e){}
  S.unsubBase=Store.watchBase(function(b){
    var pad=basePadrao();
    if(b && n(b.versao)>=3 && b.planos && b.planos.length){
      S.base = b;
      S.base.planos = pad.planos;                    // planos vêm sempre do código
      S.base.config = Object.assign({}, pad.config, b.config||{});
      S.base.alimentosCustom = b.alimentosCustom||[];
    } else S.base = pad;
    var antes=(S.base.alimentosCustom||[]).length;
    S.base.alimentosCustom=(S.base.alimentosCustom||[]).filter(function(a){ return CUSTOM_REMOVIDOS.indexOf(a.id)<0; });
    var mudou = S.base.alimentosCustom.length!==antes;
    if(SEED_BACKUP && SEED_BACKUP.alimentosCustom){
      var tem={}; (S.base.alimentosCustom||[]).forEach(function(a){ tem[a.id]=1; });
      var falt=SEED_BACKUP.alimentosCustom.filter(function(a){ return !tem[a.id]; });
      if(falt.length){ S.base.alimentosCustom=(S.base.alimentosCustom||[]).concat(falt); mudou=true; }
    }
    if(mudou) Store.saveBase(S.base);
    S.planoView=planoAtualId(dayPlanoId()); render();
  });
  subscribeDay();
  Store.allDays(30).then(function(d){ S.hist=d; render(); });
})();
